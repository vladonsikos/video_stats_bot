version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: video_stats_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_stats
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_stats"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bot:
    build: .
    container_name: video_stats_bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./videos.json:/app/videos.json
    command: >
      sh -c "
        until pg_isready -h postgres -U postgres -d video_stats; do
          echo 'Waiting for PostgreSQL to be ready...'
          sleep 2
        done
        echo 'PostgreSQL is ready. Loading data...'
        python load_data.py
        echo 'Starting bot...'
        python bot.py
      "
volumes:
  pg_data:
